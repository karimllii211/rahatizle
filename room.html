<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahat İzle - Otaq</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for chat */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030303; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-[#030303] text-white h-screen overflow-hidden flex">

    <!-- Sol Panel: Platformalar (15-20%) -->
    <div class="w-[20%] h-full bg-[#080808] border-r border-white/5 flex flex-col p-6 hidden md:flex">
        
        <div class="flex items-center gap-2 mb-8 opacity-70 hover:opacity-100 transition-opacity cursor-pointer" onclick="window.location.href='index.html'">
            <svg class="w-6 h-6 text-[#FF014C]" fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 2v12h16V6H4zm2 2h2v8H6V8zm4 0h2v8h-2V8zm4 0h2v8h-2V8z"/></svg>
            <span class="font-['Montserrat'] font-black text-xl tracking-wider text-white">RAHAT İZLE<span class="text-[#FF014C]">.</span></span>
        </div>

        <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-4 font-bold">Platformalar</h3>
        
        <div class="flex flex-col gap-3">
            <button class="room-platform-btn flex items-center gap-3 w-full bg-white/5 hover:bg-[#E50914]/10 border border-transparent hover:border-[#E50914]/50 px-4 py-3 rounded-xl transition-all duration-300 group" data-platform="netflix">
                <span class="text-white font-semibold group-hover:text-[#E50914] transition-colors text-sm">Netflix</span>
            </button>
            <button class="room-platform-btn flex items-center gap-3 w-full bg-white/5 hover:bg-[#FF0000]/10 border border-transparent hover:border-[#FF0000]/50 px-4 py-3 rounded-xl transition-all duration-300 group" data-platform="youtube">
                <span class="text-white font-semibold group-hover:text-[#FF0000] transition-colors text-sm">YouTube</span>
            </button>
            <button class="room-platform-btn flex items-center gap-3 w-full bg-white/5 hover:bg-[#0063E5]/10 border border-transparent hover:border-[#0063E5]/50 px-4 py-3 rounded-xl transition-all duration-300 group" data-platform="disney">
                <span class="text-white font-semibold group-hover:text-[#0063E5] transition-colors text-sm">Disney+</span>
            </button>
            <button class="room-platform-btn flex items-center gap-3 w-full bg-white/5 hover:bg-[#00A8E1]/10 border border-transparent hover:border-[#00A8E1]/50 px-4 py-3 rounded-xl transition-all duration-300 group" data-platform="prime">
                <span class="text-white font-semibold group-hover:text-[#00A8E1] transition-colors text-sm">Prime Video</span>
            </button>
        </div>

        <div class="mt-auto pt-6 border-t border-white/5">
            <button id="localVideoBtn" class="room-platform-btn w-full flex items-center justify-center gap-2 bg-transparent border border-white/20 hover:border-white hover:bg-white/10 text-white font-semibold py-3 rounded-xl transition-all duration-300 text-sm" data-platform="local" onclick="document.getElementById('local-video-upload').click()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                Cihazdan yüklə
            </button>
            <input type="file" id="local-video-upload" accept="video/*" class="hidden">
        </div>
    </div>

    <!-- Mərkəz: Video Ekranı (60-65%) -->
    <div class="flex-1 h-full flex flex-col relative bg-black">
        <!-- Otaq Header-i (Sayğac və Sil düyməsi) -->
        <div class="absolute top-0 left-0 w-full p-6 flex items-start justify-between z-10 bg-gradient-to-b from-black/80 to-transparent">
            
            <div class="flex flex-col gap-1">
                <span class="text-xs text-gray-400 font-medium tracking-widest" id="roomCodeDisplay">KOD: ---</span>
                <div class="flex items-center gap-2 bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 w-fit">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span id="activeViewerCount" class="text-xs font-bold text-white">Aktiv İzləyici: 1</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="closeVideoBtn" class="hidden px-4 py-2 bg-yellow-600/50 hover:bg-yellow-500 text-white text-xs font-bold rounded-lg border border-yellow-400/50 transition-all duration-300 tracking-wider uppercase">
                    VİDEONU BAĞLA
                </button>
                <button onclick="window.location.href='index.html'" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-xs font-bold rounded-lg border border-white/20 transition-all duration-300 tracking-wider uppercase">
                    Otaqdan Çıx
                </button>
                <button id="deleteRoomBtn" class="hidden px-4 py-2 bg-red-900/50 hover:bg-red-700 text-white text-xs font-bold rounded-lg border border-red-500/50 transition-all duration-300 tracking-wider uppercase">
                    Otağı Sil
                </button>
            </div>
        </div>

        <!-- Video Player Placeholder -->
        <div class="flex-1 w-full h-full flex flex-col items-center justify-center p-8">
            <div class="w-full max-w-5xl aspect-video rounded-3xl border border-white/10 bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.5)] flex items-center justify-center relative overflow-hidden group">
                <video id="main-video" controls muted autoplay playsinline class="w-full h-full object-contain hidden z-20 relative"></video>
                <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center z-10 opacity-30 group-hover:opacity-100 transition-opacity duration-500">
                    <div class="absolute inset-0 bg-gradient-to-tr from-[#FF014C]/5 to-transparent pointer-events-none"></div>
                    <svg class="w-16 h-16 text-white mb-4 z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="font-['Montserrat'] font-black tracking-widest text-xl text-white z-10">VİDEO EKRANI</span>
                </div>
            </div>
        </div>
        
        <!-- Toggle Chat Button -->
        <button id="toggleChatBtn" class="absolute right-0 top-1/2 -translate-y-1/2 z-40 bg-[#0A0A0A] border border-white/10 border-r-0 rounded-l-xl p-3 text-gray-400 hover:text-[#FF014C] transition-colors shadow-[-5px_0_15px_rgba(0,0,0,0.5)]">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        </button>
    </div>

    <!-- Sağ Panel: Canlı Chat (20-25%) -->
    <div id="chatPanel" class="w-full md:w-[320px] absolute right-0 top-0 h-full flex flex-col bg-[#0A0A0A] border-l border-white/5 transition-transform duration-500 ease-in-out translate-x-full z-50 shadow-[-10px_0_30px_rgba(0,0,0,0.8)]">
        
        <!-- Chat Header -->
        <div class="p-5 border-b border-white/5 bg-[#050505] flex items-center justify-between">
            <h2 class="text-sm font-bold uppercase tracking-widest text-[#FF014C] flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                Canlı Chat
            </h2>
            <button id="closeChatBtn" class="text-gray-400 hover:text-white transition-colors focus:outline-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Chat Messages Container -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <!-- Messages will be injected here via JS -->
            <div class="text-center text-xs text-gray-600 mt-4 tracking-wider opacity-50" id="chatEmptyState">
                Otağa qoşuldunuz. Mesaj yaza bilərsiniz...
            </div>
        </div>
        
        <!-- Chat Input Form -->
        <form id="chatForm" class="p-4 border-t border-white/5 bg-[#050505] flex items-center gap-2" onsubmit="event.preventDefault();">
            <input type="text" id="chatInput" placeholder="Mesaj yaz..." class="flex-1 bg-white/5 border border-white/10 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-[#FF014C] transition-colors text-sm placeholder-gray-500" autocomplete="off">
            <button type="submit" id="chatSendBtn" class="bg-[#FF014C] hover:bg-[#FF014C]/80 text-white w-12 h-12 rounded-xl flex items-center justify-center transition-colors">
                <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
    </div>

    <!-- CUSTOM TOAST BİLDİRİŞİ -->
    <div id="custom-toast" class="hidden fixed top-6 right-6 z-50 bg-black border border-red-600 shadow-[0_0_15px_rgba(220,38,38,0.4)] rounded-xl px-6 py-4 items-center gap-4 transition-all max-w-md">
        <span id="toast-message" class="text-white font-medium">Bildiriş mətni bura gələcək</span>
        <button id="toast-close-btn" class="text-gray-400 hover:text-red-500 transition-colors ml-auto focus:outline-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- CUSTOM CONFIRM MODALI -->
    <div id="custom-confirm" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-black border border-red-600 shadow-[0_0_25px_rgba(220,38,38,0.3)] rounded-2xl p-8 max-w-md w-full text-center animate-fade-in">
            <h3 class="text-2xl font-bold text-white mb-4 uppercase tracking-wider">Diqqət</h3>
            <p id="confirm-message" class="text-gray-300 mb-8 text-lg">Bu əməliyyatı etmək istədiyinizə əminsiniz?</p>
            <div class="flex items-center justify-center gap-4">
                <button id="confirm-no-btn" class="px-6 py-3 bg-transparent border border-gray-600 hover:bg-gray-800 text-white font-bold rounded-xl transition-all w-1/2">
                    Xeyr
                </button>
                <button id="confirm-yes-btn" class="px-6 py-3 bg-red-700 hover:bg-red-800 text-white font-bold rounded-xl transition-all duration-300 w-1/2 shadow-[0_0_10px_rgba(220,38,38,0.4)]">
                    Bəli
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (compat versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="room.js"></script>
</body>
</html>
