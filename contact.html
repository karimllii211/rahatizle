        <a href="mailto:founder@rahatizle.site" class="btn-press btn-glow btn-lift group inline-flex w-full max-w-md items-center justify-center gap-3 overflow-hidden rounded-2xl border border-white/10 bg-white/5 px-5 py-4 text-base font-bold text-white shadow-[0_0_20px_rgba(255,1,76,0.1)] hover:border-[#FF014C] hover:shadow-[0_0_40px_rgba(255,1,76,0.4)] sm:px-8 sm:py-5 sm:text-xl md:text-2xl" data-reveal data-reveal-delay="3">
