<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Otağı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (compat versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased h-screen flex overflow-hidden opacity-0 transition-opacity duration-300">
    <!-- Sol tərəf (Video Player) - 70% -->
    <div class="w-full lg:w-[70%] h-full p-4 flex flex-col">
        <header class="mb-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-white hover:text-slate-300 transition-colors">
                Logo<span class="text-blue-500">.</span>
            </a>
            <div id="roomInfo" class="bg-slate-900 px-4 py-2 rounded-full text-sm font-medium border border-slate-800">
                Otaq Kodu: <span id="displayRoomCode" class="text-blue-400 font-bold ml-1">...</span>
            </div>
        </header>
        <div class="flex-1 bg-black rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden shadow-2xl">
            <p class="text-slate-500 text-lg font-medium flex items-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Video burada olacaq
            </p>
        </div>
    </div>

    <!-- Sağ tərəf (Canlı Chat) - 30% -->
    <div class="hidden lg:flex w-[30%] h-full bg-slate-900 border-l border-slate-800 flex-col">
        <div class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur-sm z-10">
            <h2 class="text-lg font-semibold flex items-center gap-2 text-white">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                Canlı Chat
            </h2>
        </div>
        
        <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-4" id="chatMessages">
            <!-- Nümunə mesajlar (demo üçün) -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-900 flex items-center justify-center text-xs font-bold shrink-0 text-white">A</div>
                <div>
                    <div class="bg-slate-800 px-3 py-2 rounded-2xl rounded-tl-sm text-sm inline-block shadow-sm text-slate-200">Xoş gəlmisiniz!</div>
                    <div class="text-[10px] text-slate-500 mt-1 ml-1">10:00</div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-800 bg-slate-900/50 backdrop-blur-sm">
            <form id="chatForm" class="flex gap-2">
                <input type="text" placeholder="Mesaj yazın..." class="flex-1 bg-slate-950 border border-slate-800 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-slate-200 placeholder-slate-500">
                <button type="submit" class="w-10 h-10 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center justify-center transition-colors shrink-0 text-white shadow-lg shadow-blue-900/20">
                    <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>
    
    <script src="room.js"></script>
</body>
</html>
