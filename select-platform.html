<!DOCTYPE html>
<html lang="az">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' * wss: https:; img-src 'self' * data: blob:; frame-src 'self' *; style-src 'self' * 'unsafe-inline'; font-src 'self' * data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030303">
    <meta name="robots" content="noindex">
    <title>Rahat İzle — Platforma Seç</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="styles.css?v=10">
    <script src="animations.js?v=2"></script>
</head>
<body class="page-enter min-h-screen bg-gradient-to-b from-[#030303] via-[#030303] to-[#FF014C]/10 font-sans text-white antialiased">

    <header class="px-4 pt-6 sm:px-8">
        <a href="index.html" id="backToRoomLink" class="group inline-flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-gray-400 transition-colors hover:text-white">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Otağa Qayıt
        </a>
    </header>

    <main class="mx-auto flex w-full max-w-4xl flex-col items-center px-4 py-10 sm:px-8 sm:py-16">
        <h1 class="mb-3 text-center font-display text-3xl font-extrabold tracking-tight text-white sm:text-4xl" data-reveal>Platforma Seç</h1>
        <p class="mb-10 max-w-md text-center text-sm text-gray-400 sm:text-base" data-reveal data-reveal-delay="1">İzləmək istədiyiniz platformanı seçin, otağınız avtomatik yenilənəcək.</p>

        <div class="grid w-full grid-cols-2 gap-3 sm:gap-4 md:grid-cols-4" data-reveal data-reveal-delay="2">
            <button type="button" class="platform-select-card btn-press card-lift flex flex-col items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg shadow-black/20 hover:border-[#E50914]/50 hover:bg-[#E50914]/10 sm:p-7" data-platform="netflix">
                <img src="Netflix.png" alt="Netflix" class="h-11 w-11 object-contain sm:h-14 sm:w-14">
                <span class="text-sm font-bold text-white sm:text-base">Netflix</span>
            </button>
            <button type="button" class="platform-select-card btn-press card-lift flex flex-col items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg shadow-black/20 hover:border-[#FF0000]/50 hover:bg-[#FF0000]/10 sm:p-7" data-platform="youtube">
                <img src="YouTubeLogo1.png" alt="YouTube" class="h-11 w-11 object-contain sm:h-14 sm:w-14">
                <span class="text-sm font-bold text-white sm:text-base">YouTube</span>
            </button>
            <button type="button" class="platform-select-card btn-press card-lift flex flex-col items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg shadow-black/20 hover:border-[#0063E5]/50 hover:bg-[#0063E5]/10 sm:p-7" data-platform="disney">
                <img src="DisneyPlus.png" alt="Disney+" class="h-11 w-11 object-contain sm:h-14 sm:w-14">
                <span class="text-sm font-bold text-white sm:text-base">Disney+</span>
            </button>
            <button type="button" class="platform-select-card btn-press card-lift flex flex-col items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg shadow-black/20 hover:border-[#00A8E1]/50 hover:bg-[#00A8E1]/10 sm:p-7" data-platform="prime">
                <img src="PrimeVideo.svg.webp" alt="Prime Video" class="h-11 w-11 object-contain sm:h-14 sm:w-14">
                <span class="text-sm font-bold text-white sm:text-base">Prime Video</span>
            </button>
            <button type="button" class="platform-select-card btn-press card-lift flex flex-col items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg shadow-black/20 hover:border-[#FF014C]/50 hover:bg-[#FF014C]/10 sm:p-7" data-platform="local">
                <svg class="h-11 w-11 sm:h-14 sm:w-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"></path></svg>
                <span class="text-sm font-bold text-white sm:text-base">Cihazdan Yüklə</span>
            </button>
        </div>
    </main>

    <!-- TOAST -->
    <div id="custom-toast" class="hidden animate-toast fixed right-4 top-4 z-[60] max-w-md items-center gap-4 rounded-xl border border-red-600 bg-black px-5 py-4 shadow-[0_0_15px_rgba(220,38,38,0.4)]" role="status" aria-live="polite">
        <span id="toast-message" class="text-sm font-medium text-white"></span>
        <button type="button" id="toast-close-btn" class="ml-auto text-gray-400 transition-colors hover:text-red-500 focus:outline-none" aria-label="Bağla">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script defer src="select-platform.js"></script>
</body>
</html>
