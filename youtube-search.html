<!DOCTYPE html>
<html lang="az">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' * wss: https:; img-src 'self' * data: blob:; frame-src 'self' *; style-src 'self' * 'unsafe-inline'; font-src 'self' * data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030303">
    <meta name="robots" content="noindex">
    <title>Rahat İzle — YouTube Axtarış</title>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="styles.css?v=10">
    <script src="animations.js?v=2"></script>
</head>
<body class="page-enter min-h-screen bg-[#030303] font-sans text-white antialiased">

    <header class="px-4 pt-6 sm:px-8">
        <a href="/" id="backToPlatformLink" class="group inline-flex items-center gap-2 text-sm font-bold uppercase tracking-wider text-gray-400 transition-colors hover:text-white">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Platformalara Qayıt
        </a>
    </header>

    <main class="mx-auto flex w-full max-w-2xl flex-col items-center px-4 py-8 sm:px-8">
        <img src="YouTubeLogo1.png" alt="YouTube" class="mb-5 h-14 w-14 object-contain sm:h-16 sm:w-16" data-reveal>

        <div class="relative w-full" data-reveal data-reveal-delay="1">
            <label for="yt-search-input" class="sr-only">YouTube-da axtar</label>
            <input type="text" id="yt-search-input" placeholder="YouTube-da axtar..." autocomplete="off"
                   class="w-full rounded-xl border border-white/10 bg-white/5 px-5 py-4 text-sm text-white placeholder-gray-500 transition-colors focus:border-[#FF014C] focus:outline-none">
            <div id="yt-suggest-list" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:#0A0A0A;border:1px solid rgba(255,255,255,0.1);border-radius:8px;overflow:hidden;overflow-y:auto;max-height:220px;z-index:1000;"></div>
        </div>

        <div id="yt-search-status" class="mt-3 min-h-[16px] text-xs text-gray-500"></div>

        <div id="yt-search-results" class="mt-4 flex w-full flex-wrap justify-center gap-3"></div>

        <div id="yt-loadmore-wrap" class="mt-5 hidden w-full text-center">
            <button type="button" id="yt-loadmore-btn" class="btn-press rounded-lg border border-[#FF014C]/50 bg-[#FF014C]/20 px-6 py-3 text-sm font-bold text-[#FF014C]">Daha çox göstər</button>
        </div>
    </main>

    <!-- TOAST -->
    <div id="custom-toast" class="hidden animate-toast fixed right-4 top-4 z-[60] max-w-md items-center gap-4 rounded-xl border border-red-600 bg-black px-5 py-4 shadow-[0_0_15px_rgba(220,38,38,0.4)]" role="status" aria-live="polite">
        <span id="toast-message" class="text-sm font-medium text-white"></span>
        <button type="button" id="toast-close-btn" class="ml-auto text-gray-400 transition-colors hover:text-red-500 focus:outline-none" aria-label="Bağla">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script defer src="youtube-search.js"></script>
</body>
</html>
