<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahat İzle - Otaq</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex overflow-hidden">

    <!-- Video Area (Left) -->
    <div class="w-[75%] lg:w-[80%] h-full flex flex-col items-center justify-center border-r border-white/10 p-8 relative">
        <div class="text-white/30 text-2xl lg:text-4xl font-bold uppercase tracking-widest border-2 border-white/10 rounded-2xl p-12 flex items-center justify-center w-full h-full max-h-[85vh] border-dashed">
            Video Ekranı
        </div>
    </div>

    <!-- Chat Panel (Right) -->
    <div class="w-[25%] lg:w-[20%] h-full flex flex-col bg-[#050505]">
        <div class="p-5 border-b border-white/10 flex flex-col gap-2 bg-[#0A0A0A]">
            <h2 class="text-lg font-bold uppercase tracking-wider text-[#FF014C]">Chat Paneli</h2>
            <span class="text-xs text-gray-400 font-medium tracking-widest" id="roomCodeDisplay">KOD: Yüklənir...</span>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <div class="text-center text-xs text-gray-600 mt-10 tracking-wider">
                Söhbət mesajları burada görünəcək...
            </div>
        </div>
        
        <div class="p-4 border-t border-white/10 bg-[#0A0A0A]">
            <input type="text" placeholder="Mesaj yaz..." class="w-full bg-white/5 border border-white/10 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-[#FF014C] transition-colors text-sm">
        </div>
    </div>

    <script>
        // Sadə JS otaq kodunu URL-dən alıb ekranda göstərmək üçün
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomId = urlParams.get('id');
            const roomCodeDisplay = document.getElementById('roomCodeDisplay');
            if (roomId && roomCodeDisplay) {
                roomCodeDisplay.textContent = `KOD: ${roomId}`;
            }
        });
    </script>
</body>
</html>
