<!DOCTYPE html>
<html lang="az">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' * 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' * wss: https:; img-src 'self' * data: blob:; frame-src 'self' *; style-src 'self' * 'unsafe-inline'; font-src 'self' * data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030303">
    <meta name="robots" content="noindex">
    <title>Rahat İzle — Otaq</title>
    <!-- EmailJS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="styles.css?v=2">
    <script src="animations.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        .room-platform-btn {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 8px !important;
            padding: 18px 8px !important;
            text-align: center !important;
        }
        .sidebar-logo {
            width: 24px !important;
            height: 24px !important;
            min-width: 24px !important;
            object-fit: contain !important;
            margin: 0 !important;
        }
        .neon-logo { filter: drop-shadow(0 0 15px currentColor); max-width: 200px; }
        #chatPanel { z-index: 9999 !important; }

        .sidebar-mini-icon { width: 32px !important; height: 32px !important; max-width: 32px !important; min-width: 32px !important; object-fit: contain !important; display: block !important; margin: 0 !important; }

        /* === YOUTUBE PLEYERİN GÖRÜNMƏSİ === */
        #player,
        #player iframe {
            display: block !important;
            width: 100% !important;
            aspect-ratio: 16 / 9 !important;
            height: auto !important;
            max-width: 100% !important;
            max-height: none !important;
            min-height: 0 !important;
        }

        /* === MOBİLDƏ "OTAĞI SİL" DÜYMƏSİ KOMPAKTLAŞDIRILIR ===
           Header-in sağ tərəfindəki düymələr konteyneri (VİDEONU BAĞLA / Çıx /
           Otağı Sil) shrink-0 olduğu üçün öz təbii (masaüstü) enini saxlayır.
           Dar ekranlarda bu, sol tərəfdəki KOD/İzləyici sütununu demək olar
           sıfır enə sıxışdırır və "Aktiv İzləyici" pilli düymələrin üstünə
           vizual olaraq düşür (test edildi: 320-375px enində real overlap).
           Həll: düymələr qrupu lazım gələndə öz sətrinə keçsin (header
           flex-wrap), və hər düymə bir az kompaktlaşsın. Rənglər və masaüstü
           görünüş toxunulmur — yalnız 768px altında. */
        @media (max-width: 768px) {
            header {
                flex-wrap: wrap !important;
                row-gap: 8px !important;
            }
            header .flex.shrink-0.flex-wrap {
                width: 100% !important;
                justify-content: flex-end !important;
            }
            #deleteRoomBtn,
            #closeVideoBtn,
            header .flex.shrink-0.flex-wrap > a {
                padding: 6px 10px !important;
                font-size: 9px !important;
                line-height: 1.2 !important;
                white-space: nowrap !important;
                flex-shrink: 1 !important;
                min-width: 0 !important;
            }
        }
</style>
</head>
<body class="page-enter flex h-[100dvh] overflow-hidden bg-[#030303] font-sans text-white">

    <!-- SOL PANEL — masaüstündə sabit, mobildə sürüşən çekmece -->
    <aside id="sidePanel"
           class="fixed inset-y-0 left-0 z-50 flex w-[80%] max-w-[300px] -translate-x-full flex-col border-r border-white/5 bg-[#080808] p-5 transition-transform duration-300 ease-out md:static md:z-auto md:w-[240px] md:max-w-none md:translate-x-0 lg:w-[260px] lg:p-6">

        <div class="mb-6 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 opacity-70 transition-opacity hover:opacity-100">
                <img src="logo.png" alt="Rahat İzle" width="224" height="128" decoding="async" class="h-7 w-auto">
            </a>
            <button type="button" id="closePanelBtn" class="btn-press -mr-1 p-1 text-gray-400 hover:text-white md:hidden" aria-label="Paneli bağla">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <h2 class="mb-3 text-xs font-bold uppercase tracking-widest text-gray-500">Platforma</h2>

        <a href="#" id="changePlatformLink" class="btn-press group mb-4 flex items-center gap-3 rounded-xl border border-[#FF014C]/30 bg-gradient-to-br from-white/5 to-[#FF014C]/5 px-3 py-3 shadow-[0_0_15px_rgba(255,1,76,0.1)] transition-all hover:border-[#FF014C]/60 hover:shadow-[0_0_20px_rgba(255,1,76,0.25)]">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-black/40 ring-1 ring-white/10">
                <img id="activePlatformIcon" src="" alt="" class="h-5 w-5 object-contain hidden">
                <svg id="activePlatformIconFallback" class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h7"></path></svg>
            </span>
            <span class="min-w-0 flex-1 text-left">
                <span id="activePlatformName" class="block truncate text-sm font-bold text-white">Platforma Seç</span>
                <span class="block text-[10px] font-medium uppercase tracking-wider text-gray-500 group-hover:text-[#FF014C]">Dəyişmək üçün klikləyin</span>
            </span>
            <svg class="h-4 w-4 shrink-0 text-gray-500 group-hover:text-[#FF014C]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </a>

        <div class="mt-auto border-t border-white/5 pt-5">
            <button type="button" id="localVideoBtn" class="room-platform-btn btn-press flex flex-col w-full items-center justify-center gap-1 rounded-xl border border-white/20 bg-transparent py-3 text-sm font-semibold text-white hover:bg-white/10" data-platform="local">
                <div class="flex items-center gap-2">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Cihazdan yüklə</span>
                </div>
                <span class="text-[10px] font-bold text-red-500 tracking-wider">500MB LİMİT</span>
            </button>
            <input type="file" id="local-video-upload" accept="video/*" class="hidden">
        </div>
    </aside>

    <!-- Mobil çekmece üçün arxa fon -->
    <div id="panelBackdrop" class="fixed inset-0 z-40 hidden bg-black/60 backdrop-blur-sm md:hidden"></div>

    <!-- MƏRKƏZ: VİDEO -->
    <div class="relative flex h-full flex-1 flex-col bg-black">

        <header class="absolute left-0 top-0 z-20 flex w-full items-start justify-between gap-2 bg-gradient-to-b from-black/90 to-transparent p-3 backdrop-blur-sm sm:p-5">
            <div class="flex min-w-0 items-center gap-2">
                <button type="button" id="openPanelBtn" class="btn-press flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-white/10 bg-black/50 text-white md:hidden" aria-label="Platformalar menyusu">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex min-w-0 flex-col gap-1">
                    <span id="roomCodeDisplay" class="truncate text-[11px] font-medium tracking-widest text-gray-400 sm:text-xs">KOD: ---</span>
                    <div class="flex w-fit items-center gap-2 rounded-full border border-white/10 bg-black/50 px-2.5 py-1">
                        <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-green-500"></span>
                        <span id="activeViewerCount" class="whitespace-nowrap text-[10px] font-bold text-white sm:text-xs">Aktiv İzləyici: 1</span>
                    </div>
                    <div id="viewerAvatars" class="flex items-center" style="gap: 4px; margin-top: 2px;"></div>
                </div>
            </div>

            <div class="flex shrink-0 flex-wrap items-center justify-end gap-2">

                <button type="button" id="closeVideoBtn" class="btn-press hidden rounded-lg border border-yellow-400/50 bg-yellow-600/50 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-yellow-500 sm:text-xs">
                    <span>VİDEONU BAĞLA</span>
                </button>
                <a href="index.html" class="btn-press rounded-lg border border-white/20 bg-white/10 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/20 sm:text-xs">
                    <span>Çıx</span>
                </a>
                <button type="button" id="deleteRoomBtn" class="btn-press hidden rounded-lg border border-red-500/50 bg-red-900/50 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-red-700 sm:text-xs">
                    <span>Otağı Sil</span>
                </button>
            </div>
        </header>

        
        <div id="videoScrollWrapper" class="flex h-full w-full flex-1 flex-col items-center overflow-y-auto p-3 pt-24 pb-20 sm:p-6 sm:pt-28 sm:pb-24">
            <div id="videoStageBox" class="group relative flex aspect-video w-full max-w-5xl shrink-0 items-center justify-center overflow-visible rounded-2xl border border-white/10 bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.5)] sm:rounded-3xl">
                <video id="main-video" controls muted autoplay playsinline class="relative z-20 hidden h-full w-full object-contain rounded-2xl sm:rounded-3xl"></video>
                <div id="video-placeholder" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-black transition-opacity duration-500 rounded-2xl sm:rounded-3xl overflow-y-auto">
                    <!-- Dinamik məzmun buraya yüklənəcək -->
                </div>
            </div>

            <!-- Chat düyməsi -->
        <button type="button" id="toggleChatBtn" class="btn-press absolute bottom-5 right-4 z-30 flex h-12 w-12 items-center justify-center rounded-full border border-white/10 bg-[#0A0A0A] text-gray-300 shadow-[0_4px_20px_rgba(0,0,0,0.6)] hover:text-[#FF014C] md:bottom-auto md:right-0 md:top-1/2 md:h-auto md:w-auto md:-translate-y-1/2 md:rounded-l-xl md:rounded-r-none md:border-r-0 md:p-3" aria-label="Söhbəti aç" onclick="event.preventDefault(); document.getElementById('chatPanel').classList.toggle('translate-x-full');">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        </button>
    </div>
    </div>

    <!-- SAĞ PANEL: CHAT -->
    <div id="chatPanel" class="absolute right-0 top-0 z-50 flex h-full w-full translate-x-full flex-col border-l border-white/5 bg-[#0A0A0A] shadow-[-10px_0_30px_rgba(0,0,0,0.8)] transition-transform duration-300 ease-out sm:w-[360px] md:w-[320px]">

        <div class="flex items-center justify-between border-b border-white/5 bg-[#050505] p-4 sm:p-5">
            <h2 class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-[#FF014C]">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span>Canlı Chat</span>
            </h2>
            <button type="button" id="closeChatBtn" class="btn-press p-1 text-gray-400 hover:text-white focus:outline-none" aria-label="Söhbəti bağla" onclick="event.preventDefault(); document.getElementById('chatPanel').classList.add('translate-x-full');">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="chatMessages" class="flex flex-1 flex-col gap-4 overflow-y-auto p-4">
            <div class="mt-4 text-center text-xs tracking-wider text-gray-600 opacity-50" id="chatEmptyState">
                <span>Otağa qoşuldunuz. Mesaj yaza bilərsiniz...</span>
            </div>
        </div>

        <form id="chatForm" class="flex items-center gap-2 border-t border-white/5 bg-[#050505] p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:p-4" data-no-submit>
            <label for="chatInput" class="sr-only">Mesaj</label>
            <input type="text" id="chatInput" placeholder="Mesaj yaz..." maxlength="500" autocomplete="off"
                   class="min-w-0 flex-1 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder-gray-500 transition-colors focus:border-[#FF014C] focus:outline-none">
            <button type="submit" id="chatSendBtn" class="btn-press flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#FF014C] text-white hover:bg-[#FF014C]/80" aria-label="Göndər">
                <svg class="ml-1 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
    </div>

    <!-- TOAST -->
    <div id="custom-toast" class="hidden animate-toast fixed right-4 top-4 z-[60] max-w-md items-center gap-4 rounded-xl border border-red-600 bg-black px-5 py-4 shadow-[0_0_15px_rgba(220,38,38,0.4)]" role="status" aria-live="polite">
        <span id="toast-message" class="text-sm font-medium text-white"></span>
        <button type="button" id="toast-close-btn" class="ml-auto text-gray-400 transition-colors hover:text-red-500 focus:outline-none" aria-label="Bağla">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- CONFIRM -->
    <div id="custom-confirm" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
        <div class="animate-modal w-full max-w-md rounded-2xl border border-red-600 bg-black p-6 text-center shadow-[0_0_25px_rgba(220,38,38,0.3)] sm:p-8">
            <h3 class="mb-4 text-2xl font-bold uppercase tracking-wider text-white">Diqqət</h3>
            <p id="confirm-message" class="mb-8 text-base text-gray-300 sm:text-lg">Bu əməliyyatı etmək istədiyinizə əminsiniz?</p>
            <div class="flex items-center justify-center gap-4">
                <button type="button" id="confirm-no-btn" class="btn-press w-1/2 rounded-xl border border-gray-600 bg-transparent px-6 py-3 font-bold text-white hover:bg-gray-800">Xeyr</button>
                <button type="button" id="confirm-yes-btn" class="btn-press w-1/2 rounded-xl bg-red-700 px-6 py-3 font-bold text-white shadow-[0_0_10px_rgba(220,38,38,0.4)] hover:bg-red-800">Bəli</button>
            </div>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script defer src="room.js?v=5"></script>
</body>
</html>
