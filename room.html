<!DOCTYPE html>
<html lang="az">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://www.gstatic.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.vercel.app https://*.firebaseapp.com wss://*.firebaseio.com https://*.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://api.emailjs.com https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; img-src 'self' data: https: blob:; media-src 'self' blob:; frame-src https://rahatizle-yeni.firebaseapp.com https://accounts.google.com https://www.youtube.com;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#030303">
    <meta name="robots" content="noindex">
    <title>Rahat İzle — Otaq</title>
    <!-- EmailJS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="styles.css">
    <script src="animations.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script defer src="i18n.js"></script>
</head>
<body class="page-enter flex h-[100dvh] overflow-hidden bg-[#030303] font-sans text-white">

    <!-- SOL PANEL — masaüstündə sabit, mobildə sürüşən çekmece -->
    <aside id="sidePanel"
           class="fixed inset-y-0 left-0 z-50 flex w-[80%] max-w-[300px] -translate-x-full flex-col border-r border-white/5 bg-[#080808] p-5 transition-transform duration-300 ease-out md:static md:z-auto md:w-[240px] md:max-w-none md:translate-x-0 lg:w-[260px] lg:p-6">

        <div class="mb-6 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 opacity-70 transition-opacity hover:opacity-100">
                <img src="logo.png" alt="Rahat İzle" width="224" height="128" decoding="async" class="h-7 w-auto">
            </a>
            <button type="button" id="closePanelBtn" class="btn-press -mr-1 p-1 text-gray-400 hover:text-white md:hidden" aria-label="Paneli bağla">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <h2 class="mb-4 text-xs font-bold uppercase tracking-widest text-gray-500">Platformalar</h2>

        <div class="flex flex-col gap-2.5 overflow-y-auto">
            <button type="button" class="room-platform-btn btn-press flex w-full items-center gap-3 rounded-xl border border-transparent bg-white/5 px-4 py-3 text-left hover:border-[#E50914]/50 hover:bg-[#E50914]/10" data-platform="netflix">
                <span class="text-sm font-semibold text-white">Netflix</span>
            </button>
            <button type="button" class="room-platform-btn btn-press flex w-full items-center gap-3 rounded-xl border border-transparent bg-white/5 px-4 py-3 text-left hover:border-[#FF0000]/50 hover:bg-[#FF0000]/10" data-platform="youtube">
                <span class="text-sm font-semibold text-white">YouTube</span>
            </button>
            <button type="button" class="room-platform-btn btn-press flex w-full items-center gap-3 rounded-xl border border-transparent bg-white/5 px-4 py-3 text-left hover:border-[#0063E5]/50 hover:bg-[#0063E5]/10" data-platform="disney">
                <span class="text-sm font-semibold text-white">Disney+</span>
            </button>
            <button type="button" class="room-platform-btn btn-press flex w-full items-center gap-3 rounded-xl border border-transparent bg-white/5 px-4 py-3 text-left hover:border-[#00A8E1]/50 hover:bg-[#00A8E1]/10" data-platform="prime">
                <span class="text-sm font-semibold text-white">Prime Video</span>
            </button>
        </div>

        <div class="mt-auto border-t border-white/5 pt-5">
            <button type="button" id="localVideoBtn" class="room-platform-btn btn-press flex w-full items-center justify-center gap-2 rounded-xl border border-white/20 bg-transparent py-3 text-sm font-semibold text-white hover:bg-white/10" data-platform="local">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                <span data-i18n="upload_local">Cihazdan yüklə</span>
            </button>
            <input type="file" id="local-video-upload" accept="video/*" class="hidden">
        </div>
    </aside>

    <!-- Mobil çekmece üçün arxa fon -->
    <div id="panelBackdrop" class="fixed inset-0 z-40 hidden bg-black/60 backdrop-blur-sm md:hidden"></div>

    <!-- MƏRKƏZ: VİDEO -->
    <div class="relative flex h-full flex-1 flex-col bg-black">

        <header class="absolute left-0 top-0 z-20 flex w-full items-start justify-between gap-2 bg-gradient-to-b from-black/90 to-transparent p-3 sm:p-5">
            <div class="flex min-w-0 items-center gap-2">
                <button type="button" id="openPanelBtn" class="btn-press flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-white/10 bg-black/50 text-white md:hidden" aria-label="Platformalar menyusu">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex min-w-0 flex-col gap-1">
                    <span id="roomCodeDisplay" class="truncate text-[11px] font-medium tracking-widest text-gray-400 sm:text-xs">KOD: ---</span>
                    <div class="flex w-fit items-center gap-2 rounded-full border border-white/10 bg-black/50 px-2.5 py-1">
                        <span class="h-2 w-2 shrink-0 animate-pulse rounded-full bg-green-500"></span>
                        <span id="activeViewerCount" class="whitespace-nowrap text-[10px] font-bold text-white sm:text-xs">Aktiv İzləyici: 1</span>
                    </div>
                </div>
            </div>

            <div class="flex shrink-0 flex-wrap items-center justify-end gap-2">

                <select class="lang-select rounded-lg border border-white/20 bg-white/10 px-2 py-1 text-xs text-white outline-none cursor-pointer">
                    <option value="AZ" class="bg-black">AZ</option>
                    <option value="TR" class="bg-black">TR</option>
                    <option value="EN" class="bg-black">EN</option>
                    <option value="RU" class="bg-black">RU</option>
                </select>
                <button type="button" id="closeVideoBtn" class="btn-press hidden rounded-lg border border-yellow-400/50 bg-yellow-600/50 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-yellow-500 sm:text-xs">
                    <span data-i18n="close_video">VİDEONU BAĞLA</span>
                </button>
                <a href="index.html" class="btn-press rounded-lg border border-white/20 bg-white/10 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-white/20 sm:text-xs">
                    <span data-i18n="leave_room">Çıx</span>
                </a>
                <button type="button" id="deleteRoomBtn" class="btn-press hidden rounded-lg border border-red-500/50 bg-red-900/50 px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white hover:bg-red-700 sm:text-xs">
                    <span data-i18n="delete_room">Otağı Sil</span>
                </button>
            </div>
        </header>

        
        <div class="flex h-full w-full flex-1 flex-col items-center overflow-y-auto p-3 pt-24 pb-20 sm:p-6 sm:pt-28 sm:pb-24">
            <div class="group relative flex aspect-video w-full max-w-5xl shrink-0 items-center justify-center overflow-hidden rounded-2xl border border-white/10 bg-[#050505] shadow-[0_0_50px_rgba(0,0,0,0.5)] sm:rounded-3xl">
                <video id="main-video" controls muted autoplay playsinline class="relative z-20 hidden h-full w-full object-contain"></video>
                <div id="youtube-player-container" class="absolute inset-0 z-20 hidden h-full w-full bg-black"><div id="player" class="h-full w-full"></div></div>
                <div id="video-placeholder" class="absolute inset-0 z-10 flex flex-col items-center justify-center opacity-40 transition-opacity duration-500 group-hover:opacity-100">
                    <div class="pointer-events-none absolute inset-0 bg-gradient-to-tr from-[#FF014C]/5 to-transparent"></div>
                    <svg class="z-10 mb-4 h-12 w-12 text-white sm:h-16 sm:w-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="z-10 px-4 text-center font-display text-base font-extrabold tracking-widest text-white sm:text-xl"><span data-i18n="video_screen">VİDEO EKRANI</span></span>
                </div>
            </div>

            <!-- YouTube Search UI -->
            <div class="w-full max-w-5xl mt-6 shrink-0 relative z-40">
                <div class="flex items-center rounded-xl border border-white/10 bg-white/5 transition-colors focus-within:border-[#FF014C] relative">
                    <div class="pl-4 pr-2">
                        <svg class="h-6 w-6 text-[#FF0000]" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21.582,6.186c-0.23-0.86-0.908-1.538-1.768-1.768C18.254,4,12,4,12,4S5.746,4,4.186,4.418 c-0.86,0.23-1.538,0.908-1.768,1.768C2,7.746,2,12,2,12s0,4.254,0.418,5.814c0.23,0.86,0.908,1.538,1.768,1.768 C5.746,20,12,20,12,20s6.254,0,7.814-0.418c0.86-0.23,1.538-0.908,1.768-1.768C22,16.254,22,12,22,12S22,7.746,21.582,6.186z M10,15.464V8.536L16,12L10,15.464z"></path>
                        </svg>
                    </div>
                    <input type="text" id="yt-search-input" placeholder="YouTube-da video və ya mahnı axtarın..." data-i18n-placeholder="yt_search_placeholder" class="flex-1 bg-transparent px-2 py-4 text-sm text-white placeholder-gray-500 focus:outline-none">
                    <button type="button" id="yt-search-btn" class="btn-press shrink-0 rounded-r-xl bg-[#FF014C] px-6 py-4 font-bold text-white hover:bg-[#FF014C]/80 h-full" data-i18n="yt_search_btn">Axtar</button>
                    
                    <!-- Search Results Dropdown -->
                    <div id="yt-search-results-container" class="absolute top-full left-0 right-0 mt-2 hidden rounded-xl border border-white/10 bg-[#0f0f0f] shadow-[0_10px_40px_rgba(0,0,0,0.8)] z-50 max-h-[400px] overflow-y-auto custom-scrollbar">
                        <div id="yt-search-results" class="flex flex-col p-2">
                            <!-- Results will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat düyməsi -->
        <button type="button" id="toggleChatBtn" class="btn-press absolute bottom-5 right-4 z-30 flex h-12 w-12 items-center justify-center rounded-full border border-white/10 bg-[#0A0A0A] text-gray-300 shadow-[0_4px_20px_rgba(0,0,0,0.6)] hover:text-[#FF014C] md:bottom-auto md:right-0 md:top-1/2 md:h-auto md:w-auto md:-translate-y-1/2 md:rounded-l-xl md:rounded-r-none md:border-r-0 md:p-3" aria-label="Söhbəti aç">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        </button>
    </div>

    <!-- SAĞ PANEL: CHAT -->
    <div id="chatPanel" class="absolute right-0 top-0 z-50 flex h-full w-full translate-x-full flex-col border-l border-white/5 bg-[#0A0A0A] shadow-[-10px_0_30px_rgba(0,0,0,0.8)] transition-transform duration-300 ease-out sm:w-[360px] md:w-[320px]">

        <div class="flex items-center justify-between border-b border-white/5 bg-[#050505] p-4 sm:p-5">
            <h2 class="flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-[#FF014C]">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span data-i18n="chat_title">Canlı Chat</span>
            </h2>
            <button type="button" id="closeChatBtn" class="btn-press p-1 text-gray-400 hover:text-white focus:outline-none" aria-label="Söhbəti bağla">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="chatMessages" class="flex flex-1 flex-col gap-4 overflow-y-auto p-4">
            <div class="mt-4 text-center text-xs tracking-wider text-gray-600 opacity-50" id="chatEmptyState">
                <span data-i18n="chat_empty">Otağa qoşuldunuz. Mesaj yaza bilərsiniz...</span>
            </div>
        </div>

        <form id="chatForm" class="flex items-center gap-2 border-t border-white/5 bg-[#050505] p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] sm:p-4" data-no-submit>
            <label for="chatInput" class="sr-only">Mesaj</label>
            <input type="text" id="chatInput" placeholder="Mesaj yaz..." data-i18n-placeholder="chat_placeholder" maxlength="500" autocomplete="off"
                   class="min-w-0 flex-1 rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder-gray-500 transition-colors focus:border-[#FF014C] focus:outline-none">
            <button type="submit" id="chatSendBtn" class="btn-press flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-[#FF014C] text-white hover:bg-[#FF014C]/80" aria-label="Göndər">
                <svg class="ml-1 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
    </div>

    <!-- TOAST -->
    <div id="custom-toast" class="hidden animate-toast fixed right-4 top-4 z-[60] max-w-md items-center gap-4 rounded-xl border border-red-600 bg-black px-5 py-4 shadow-[0_0_15px_rgba(220,38,38,0.4)]" role="status" aria-live="polite">
        <span id="toast-message" class="text-sm font-medium text-white"></span>
        <button type="button" id="toast-close-btn" class="ml-auto text-gray-400 transition-colors hover:text-red-500 focus:outline-none" aria-label="Bağla">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <!-- CONFIRM -->
    <div id="custom-confirm" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
        <div class="animate-modal w-full max-w-md rounded-2xl border border-red-600 bg-black p-6 text-center shadow-[0_0_25px_rgba(220,38,38,0.3)] sm:p-8">
            <h3 class="mb-4 text-2xl font-bold uppercase tracking-wider text-white">Diqqət</h3>
            <p id="confirm-message" class="mb-8 text-base text-gray-300 sm:text-lg">Bu əməliyyatı etmək istədiyinizə əminsiniz?</p>
            <div class="flex items-center justify-center gap-4">
                <button type="button" id="confirm-no-btn" class="btn-press w-1/2 rounded-xl border border-gray-600 bg-transparent px-6 py-3 font-bold text-white hover:bg-gray-800">Xeyr</button>
                <button type="button" id="confirm-yes-btn" class="btn-press w-1/2 rounded-xl bg-red-700 px-6 py-3 font-bold text-white shadow-[0_0_10px_rgba(220,38,38,0.4)] hover:bg-red-800">Bəli</button>
            </div>
        </div>
    </div>

    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script defer src="room.js"></script>
</body>
</html>
