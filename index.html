<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Otaqları</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712; /* gray-950/black mix */
            color: #ffffff;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 selection:bg-red-600 selection:text-white bg-black">

    <div class="w-full max-w-6xl mx-auto">
        
        <!-- LOGIN SECTION -->
        <div id="login-section" class="max-w-md mx-auto w-full bg-black/50 backdrop-blur-md p-8 rounded-2xl border border-red-600 shadow-[0_0_15px_rgba(220,38,38,0.2)]">
            <h2 class="text-3xl font-bold mb-8 text-center tracking-wider uppercase">Giriş</h2>
            
            <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault();">
                <div>
                    <input type="email" id="loginEmail" placeholder="E-poçt" class="w-full bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                <div>
                    <input type="password" id="loginPassword" placeholder="Şifrə" class="w-full bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                
                <button type="button" id="loginBtn" class="w-full bg-transparent border border-red-600 hover:bg-red-600 text-white font-bold py-4 rounded-xl transition-all shadow-[0_0_10px_rgba(220,38,38,0.4)] hover:shadow-[0_0_20px_rgba(220,38,38,0.6)] uppercase tracking-wider">
                    Daxil ol
                </button>
            </form>

            <div class="mt-6 flex flex-col gap-4">
                <button type="button" id="switchToRegisterBtn" class="w-full bg-transparent hover:bg-red-950/30 text-white font-medium py-3 border border-red-600 rounded-xl transition-all text-sm">
                    Yeni Hesab Yarat
                </button>
                
                <div class="flex items-center gap-4 my-2">
                    <div class="flex-1 h-px bg-red-900/50"></div>
                    <span class="text-xs text-gray-500 uppercase tracking-widest">və ya</span>
                    <div class="flex-1 h-px bg-red-900/50"></div>
                </div>

                <button id="googleLoginBtn" class="w-full flex items-center justify-center gap-3 bg-transparent hover:bg-red-950/30 text-white font-medium py-3 border border-red-600 rounded-xl transition-all shadow-[0_0_10px_rgba(220,38,38,0.2)]">
                    <svg class="w-5 h-5" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.14 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Google ilə Daxil Ol
                </button>
            </div>
        </div>

        <!-- REGISTER SECTION -->
        <div id="register-section" class="hidden max-w-md mx-auto w-full bg-black/50 backdrop-blur-md p-8 rounded-2xl border border-red-600 shadow-[0_0_15px_rgba(220,38,38,0.2)]">
            <h2 class="text-3xl font-bold mb-8 text-center tracking-wider uppercase">Qeydiyyat</h2>
            
            <form id="registerForm" class="space-y-4" onsubmit="event.preventDefault();">
                <div class="flex gap-4">
                    <input type="text" id="regFirstName" placeholder="Ad" class="w-1/2 bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                    <input type="text" id="regLastName" placeholder="Soyad" class="w-1/2 bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                <div>
                    <input type="email" id="regEmail" placeholder="E-poçt" class="w-full bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                <div>
                    <input type="password" id="regPassword" placeholder="Şifrə" class="w-full bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                <div>
                    <input type="password" id="regPasswordConfirm" placeholder="Şifrəni Təkrarla" class="w-full bg-black text-white px-5 py-4 border border-red-600 rounded-xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all placeholder-gray-500">
                </div>
                
                <button type="button" id="completeRegisterBtn" class="w-full bg-transparent border border-red-600 hover:bg-red-600 text-white font-bold py-4 mt-2 rounded-xl transition-all shadow-[0_0_10px_rgba(220,38,38,0.4)] hover:shadow-[0_0_20px_rgba(220,38,38,0.6)] uppercase tracking-wider">
                    Qeydiyyatı Tamamla
                </button>
            </form>

            <div class="mt-6 text-center">
                <button type="button" id="switchToLoginBtn" class="text-gray-400 hover:text-red-500 transition-colors text-sm underline underline-offset-4">
                    Geri qayıdıb giriş et
                </button>
            </div>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden w-full flex-col gap-10">
            
            <!-- Dashboard Header -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-red-900 pb-6 w-full">
                <div class="flex flex-col text-center sm:text-left">
                    <span class="text-sm text-red-600 uppercase tracking-widest font-bold">İdarə Paneli</span>
                    <h1 id="dashboardUserName" class="text-4xl font-black tracking-tight mt-1 text-white">İstifadəçi Adı</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button id="deleteAccountBtn" class="px-6 py-3 bg-red-700 hover:bg-red-800 text-white font-bold rounded-xl transition-all uppercase tracking-wider text-sm">
                        Hesabı Sil
                    </button>
                    <button id="logoutBtn" class="px-6 py-3 bg-transparent border border-red-600 hover:bg-red-600 text-white font-bold rounded-xl transition-all shadow-[0_0_10px_rgba(220,38,38,0.3)] uppercase tracking-wider text-sm">
                        Çıxış
                    </button>
                </div>
            </div>

            <!-- Dashboard Content (2 Large Columns) -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch w-full mt-4">
                
                <!-- Create Room Block -->
                <div class="bg-black border border-red-600 hover:border-red-500 p-12 rounded-3xl flex flex-col items-center justify-center gap-8 transition-all shadow-[0_0_20px_rgba(220,38,38,0.15)] group">
                    <div class="p-8 bg-red-600/10 rounded-full group-hover:bg-red-600/20 transition-all border border-red-900/50">
                        <svg class="w-20 h-20 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="text-center">
                        <h3 class="text-3xl font-bold mb-3 uppercase tracking-wider text-white">Yeni Otaq Yarat</h3>
                        <p class="text-gray-400 max-w-sm mx-auto text-lg">Dostlarınızı dəvət etmək üçün xüsusi və təhlükəsiz video otağı yaradın.</p>
                    </div>
                    <button id="createRoomBtn" class="mt-4 w-full max-w-md bg-transparent border border-red-600 hover:bg-red-600 text-white font-bold py-5 rounded-2xl transition-all shadow-[0_0_15px_rgba(220,38,38,0.3)] hover:shadow-[0_0_25px_rgba(220,38,38,0.5)] uppercase tracking-widest text-xl">
                        Otaq Yarat
                    </button>
                </div>

                <!-- Join Room Block -->
                <div class="bg-black border border-red-600 hover:border-red-500 p-12 rounded-3xl flex flex-col items-center justify-center gap-8 transition-all shadow-[0_0_20px_rgba(220,38,38,0.15)] group">
                    <div class="p-8 bg-red-600/10 rounded-full group-hover:bg-red-600/20 transition-all border border-red-900/50">
                        <svg class="w-20 h-20 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                    <div class="text-center">
                        <h3 class="text-3xl font-bold mb-3 uppercase tracking-wider text-white">Otağa Qoşul</h3>
                        <p class="text-gray-400 max-w-sm mx-auto text-lg">Sizə göndərilən 6 simvollu otaq kodunu daxil edərək yayıma qoşulun.</p>
                    </div>
                    <div class="w-full max-w-md flex flex-col gap-4 mt-4">
                        <input type="text" id="roomCodeInput" placeholder="KOD (məs: RAVE9X)" class="w-full bg-black border border-red-600 text-white font-bold px-6 py-5 rounded-2xl focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all uppercase tracking-[0.3em] text-center text-xl placeholder-gray-600">
                        <button id="joinRoomBtn" class="w-full bg-transparent border border-red-600 hover:bg-red-600 text-white font-bold py-5 rounded-2xl transition-all shadow-[0_0_15px_rgba(220,38,38,0.3)] hover:shadow-[0_0_25px_rgba(220,38,38,0.5)] uppercase tracking-widest text-xl">
                            Qoşul
                        </button>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!-- Firebase SDK (compat versions) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
